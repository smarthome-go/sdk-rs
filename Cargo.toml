[package]
name = "smarthome-sdk-rs"
version = "0.14.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/smarthome-go/sdk-rs"
description = "A Rust client-library which makes communication with the Smarthome server easy"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.12.1"
reqwest = { version = "0.13.5", features = ["json", "query", "rustls"], default-features = false }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"

[dev-dependencies]
http = "1.5.0"
tokio = { version = "1.53.1", features = ["full"] }
